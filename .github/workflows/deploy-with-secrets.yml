name: CI: Test & Deploy (uses service account secret)

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      # secrets should contain base64 OR the raw JSON; server supports both
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_MEMBERS_ID: ${{ secrets.GOOGLE_SHEET_MEMBERS_ID }}
      GOOGLE_DRIVE_BUKTI_FOLDER: ${{ secrets.GOOGLE_DRIVE_BUKTI_FOLDER }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Decode & validate service account
        run: node scripts/decode-sa.js
      - name: Start app (background)
        run: npm start &
      - name: Healthcheck
        run: |
          sleep 4
          curl --fail http://localhost:3000/api/health
      # Add deploy step (Vercel/Netlify) here if desired, using their official actions/CLIs
