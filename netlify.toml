[build]
  publish = "."

# Only redirect root to /admin in production to avoid redirect loops on preview deploys
[context.production]
  [[redirects]]
    from = "/"
    to = "/admin/"
    status = 302
    force = true

# Ensure /admin is served as folder index for all contexts
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = true

# Proxy API calls to Railway backend to avoid CORS issues.
# Adjust the URL below if your Railway app URL changes.
[[redirects]]
  from = "/api/*"
  to = "https://web-pramuka-penegak-production.up.railway.app/api/:splat"
  status = 200
  force = false
